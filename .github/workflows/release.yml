# Push a tag like v0.1.0 to build the Flatpak bundle and publish it as a GitHub Release.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: # a test build with no release

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      # Not the flatpak-builder container: installing the runtime inside it failed with "Invalid cross-device link".
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build flatpak/io.github.theteknocat.BubbleFairy.yml
          flatpak build-bundle repo BubbleFairy-${{ github.ref_name }}.flatpak io.github.theteknocat.BubbleFairy
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: BubbleFairy-*.flatpak

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BubbleFairy-*.flatpak --repo "$GITHUB_REPOSITORY" --title "BubbleFairy ${GITHUB_REF_NAME#v}" --generate-notes
