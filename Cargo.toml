[package]
name = "bubblefairy"
version = "0.2.5"
edition = "2024"
description = "Your iMessages on your Linux desktop, ferried over from your Mac"
license = "MIT"
repository = "https://github.com/theteknocat/bubblefairy"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
serde_json = "1"
mdns-sd = "0.21"
plist = "1"
gstreamer = "0.25"
webkit6 = "0.6"
sha2 = "0.11"
ksni = "0.3"
ashpd = { version = "0.14", features = ["background"] }

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
